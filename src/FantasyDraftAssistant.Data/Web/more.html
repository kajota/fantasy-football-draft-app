<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>More</title>
  <style>
    :root {
      --bg: #0b1220; --text: #f4fff4; --muted: #8b97a8; --mine: #e8a317; --mine-text: #1a1204; --card: #1c2638;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    body { padding: 16px; max-width: 32rem; }
    .banner { display: none; background: var(--mine); color: var(--mine-text); font-weight: 800; letter-spacing: .12em;
      text-align: center; padding: 8px; margin: -16px -16px 16px; }
    .banner.on { display: block; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .meta { color: var(--muted); margin-bottom: 16px; }
    a.card { display: block; background: var(--card); color: var(--text); text-decoration: none; padding: 18px 16px;
      margin: 10px 0; border-radius: 8px; font-size: 1.15rem; font-weight: 700; }
    a.card span { display: block; color: var(--muted); font-size: .85rem; font-weight: 500; margin-top: 4px; }
    .stale { color: var(--muted); font-size: .8rem; margin-top: 16px; }
    .ver { position: fixed; right: 10px; bottom: 8px; color: var(--muted); font-size: .75rem;
      background: var(--bg); padding: 2px 8px; z-index: 5; }
  </style>
</head>
<body>
  <div id="practice" class="banner">PRACTICE</div>
  <h1 id="league">More</h1>
  <div class="meta" id="meta">Links for this draft</div>
  <a class="card" href="index.html">Draft board<span>The grid on the TV</span></a>
  <a class="card" href="players.html">Players left<span>Who is still available, by position</span></a>
  <div class="stale" id="stale"></div>
  <div class="ver">v__APP_VERSION__</div>
  <script>
    async function poll() {
      try {
        const res = await fetch('board.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        document.getElementById('practice').classList.toggle('on', !!data.practice);
        document.getElementById('league').textContent = (data.league || 'Draft') + ' · More';
        document.title = (data.league || 'Draft') + ' · More';
        document.getElementById('meta').textContent = data.practice ? 'Practice board links' : 'Links for this draft';
        const updated = data.updatedAt ? new Date(data.updatedAt) : null;
        document.getElementById('stale').textContent = updated ? ('Updated ' + updated.toLocaleTimeString()) : '';
      } catch (err) {
        document.getElementById('stale').textContent = 'Waiting for board data…';
      }
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
