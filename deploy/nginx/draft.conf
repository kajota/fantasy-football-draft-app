# Include from the kellynorton.com HTTPS server, before location /.
# GET /draft/<slug>/ is public. PUT requires Authorization: Bearer (see draft-token.map).
# Neither auth_request nor if is valid inside limit_except, so GET is allowed
# in the internal auth location instead.

location = /_draft_auth {
    internal;
    if ($request_method = GET) { return 204; }
    if ($request_method = HEAD) { return 204; }
    if ($draft_publish_ok = 1) { return 204; }
    return 403;
}

location /draft/ {
    alias /var/www/draft/;
    autoindex off;
    charset utf-8;
    client_max_body_size 256k;
    dav_methods PUT;
    create_full_put_path off;
    dav_access user:rw group:r all:r;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_request /_draft_auth;
}
